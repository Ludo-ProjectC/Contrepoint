# ═══════════════════════════════════════════════════
#  Contrepoint — Netlify Configuration
#  Security headers + redirects + functions
# ═══════════════════════════════════════════════════

[build]
  publish = "."

# ── Netlify Functions ───────────────────────────────
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── Redirects ──────────────────────────────────────
# Force HTTPS
[[redirects]]
  from = "http://contrepoint.app/*"
  to   = "https://contrepoint.app/:splat"
  status = 301
  force  = true

# API routes → Netlify Functions (AVANT le SPA fallback)
[[redirects]]
  from = "/api/contact"
  to   = "/.netlify/functions/contact"
  status = 200

[[redirects]]
  from = "/api/validate-license"
  to   = "/.netlify/functions/validate-license"
  status = 200

[[redirects]]
  from = "/webhook/lemonsqueezy"
  to   = "/.netlify/functions/webhook-lemonsqueezy"
  status = 200

# SPA fallback (doit être en dernier)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# ── Security Headers ───────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Strict-Transport-Security = "max-age=31536000"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://apis.google.com https://accounts.google.com https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://api.web3forms.com https://api.lemonsqueezy.com https://apis.google.com https://www.googleapis.com https://accounts.google.com https://www.google-analytics.com https://region1.google-analytics.com; frame-src https://accounts.google.com https://www.youtube-nocookie.com; manifest-src 'self' data:; frame-ancestors 'none'; object-src 'none'; base-uri 'self';"
