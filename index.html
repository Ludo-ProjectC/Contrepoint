<!-- 4. FAQPage — questions fréquentes (résultats enrichis Google) -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "@id": "https://contrepoint.app/#faq",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Qu'est-ce que Contrepoint ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Contrepoint est une application web professionnelle d'outils interactifs de théorie musicale, destinée aux étudiants au conservatoire, aux compositeurs, aux chefs d'orchestre et aux musiciens autodidactes. Elle propose 12 outils couvrant la transposition, l'analyse harmonique, les cadences, les accords, les gammes, le métronome, la modulation et l'analyse SATB. L'interface est trilingue : français, anglais et espagnol."
      }
    },
    {
      "@type": "Question",
      "name": "Contrepoint est-il gratuit ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Oui, 8 outils sont entièrement gratuits et sans inscription : Transposeur, Intervalles, Harmonie, Accords, Gammes & Modes, Cadences, Métronome et Rythme. Pour 4 outils avancés (Formes musicales, Modulation, Séquences harmoniques, Analyseur SATB), un achat unique du Mode compositeur donne un accès à vie sans abonnement."
      }
    },
    {
      "@type": "Question",
      "name": "Qu'inclut le Mode compositeur ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Le Mode compositeur débloque 4 outils professionnels : (1) le constructeur de Formes musicales avec 21 formes de référence (sonate, rondo, fugue, suite, thème et variations…) ; (2) l'outil de Modulation avec 11 techniques (accord pivot, dominante secondaire, chromatique, Ger⁺⁶ enharmonique, napolitain…) ; (3) le générateur de 51 Séquences harmoniques (Pachelbel, Romanesca, Monte, Fonte, Omnibus…) ; (4) l'Analyseur SATB qui détecte automatiquement les quintes parallèles, octaves directes, croisements de voix et erreurs de résolution."
      }
    },
    {
      "@type": "Question",
      "name": "L'achat est-il unique ou un abonnement ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "C'est un achat unique avec accès à vie, sans abonnement. Toutes les mises à jour futures sont incluses. Une garantie satisfait ou remboursé de 30 jours est offerte conformément à la Loi sur la protection du consommateur du Québec."
      }
    },
    {
      "@type": "Question",
      "name": "Sur quels appareils Contrepoint fonctionne-t-il ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Contrepoint est une application web qui fonctionne directement dans le navigateur, sans installation, sur ordinateur (Chrome, Firefox, Safari, Edge), tablette et mobile. La synthèse audio nécessite la prise en charge de l'API Web Audio (disponible sur tous les navigateurs modernes)."
      }
    },
    {
      "@type": "Question",
      "name": "Quels instruments transpositeurs sont supportés ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Le Transposeur prend en charge plus de 40 instruments transpositeurs : Piccolo (Ré♭), Flûte alto (Sol), Cor anglais (Fa), petites clarinettes (Ré et Mi♭), Clarinettes (Si♭ et La), Clarinette basse, Saxophones (soprano/alto/ténor/baryton), Cors d'harmonie (Ré, Mi♭, Mi, Fa, La, Si♭), Trompettes (Ré, Mi♭, Fa, Si♭), Cornet à pistons, Saxhorns, Euphonium, Tuba, et plus encore."
      }
    },
    {
      "@type": "Question",
      "name": "Quelle terminologie d'analyse harmonique est utilisée ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Contrepoint utilise le chiffrage romain standard (I, ii, iii, IV, V, vi, vii°) avec inversions (⁶, ⁶₄, ⁶₅, ⁴₃, ⁴₂), conforme aux conventions des conservatoires francophones et anglo-saxons. Les noms de cadences sont disponibles en français (CAP, CAI, DC, CP, CR, CPh, CÉ), en anglais (PAC, IAC, HC, PC, DC, Phr., EC) et en espagnol (CAP, CAI, SC, CP, CR, CFr, CE)."
      }
    },
    {
      "@type": "Question",
      "name": "L'Analyseur SATB détecte-t-il toutes les fautes d'écriture harmonique ?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "L'Analyseur détecte automatiquement les fautes principales d'écriture à 4 voix : quintes parallèles, octaves parallèles, octaves directes, quintes directes (S–B), croisement de voix, espacement supérieur à l'octave, doublure de la sensible, résolution incorrecte de la sensible, et mouvements interdits. Les notes peuvent être saisies par drag & drop sur la portée ou par chiffrage romain dans 24 tonalités prédéfinies."
      }
    },
    {
      "@type": "Question",
      "name": "Les outils sont-ils utilisables sans connexion Internet ?",
